{% extends "sns/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 fw-bold text-primary">新規アカウント作成</h2>
                    
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <div class="form-text small text-muted">{{ field.help_text }}</div>
                                {% endif %}
                                {% for error in field.errors %}
                                    <div class="text-danger small">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">登録する</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'sns:login' %}" class="text-decoration-none small text-secondary">
                            すでにアカウントをお持ちの方はこちら
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // フォームの各入力欄にBootstrapのクラスを自動で付与
    document.querySelectorAll('input').forEach(function(el) {
        if (el.type !== 'checkbox') {
            el.classList.add('form-control');
        }
    });
</script>
{% endblock %}
