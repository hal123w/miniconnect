{% extends "sns/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="mb-4 text-center">新規アカウント作成</h3>

            <div class="card rounded-3 shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <div class="form-text small text-muted">{{ field.help_text }}</div>
                                {% endif %}
                                {% for error in field.errors %}
                                    <div class="text-danger small">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">登録する</button>
                        </div>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        <a href="{% url 'sns:login' %}" class="text-decoration-none text-secondary">
                            すでにアカウントをお持ちの方はこちら
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('input').forEach(function(el) {
        if (el.type !== 'checkbox') {
            el.classList.add('form-control');
        }
    });
});
</script>
{% endblock %}
