{% extends "sns/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="mb-4">パスワード変更</h3>

            <div class="card rounded-3 shadow-sm border-0">
                <div class="card-body p-4">
                    <p class="text-muted small mb-4">新しいパスワードを入力してください。</p>

                    <form method="POST">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <div class="form-text small">{{ field.help_text }}</div>
                                {% endif %}
                                {% for error in field.errors %}
                                    <div class="text-danger small">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">パスワードを更新する</button>
                            <a href="{% url 'sns:profile_edit' %}" class="btn btn-link text-secondary">キャンセルして戻る</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('input').forEach(function(el) {
        el.classList.add('form-control');
    });
});
</script>
{% endblock %}
