{% extends "sns/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="mb-4">検索</h3>

            <form method="get" action="{% url 'sns:search' %}" class="mb-4">
                <div class="input-group">
                    <input type="search" name="q" value="{{ q }}" class="form-control"
                           placeholder="投稿・ユーザー・#タグを検索">
                    <button type="submit" class="btn btn-primary">検索</button>
                </div>
            </form>

            {% if q %}
                <h5 class="mb-3">投稿</h5>
                {% for post in posts %}
                    {% include "sns/_post_card.html" %}
                {% empty %}
                    <p class="text-muted">該当する投稿はありません。</p>
                {% endfor %}

                <h5 class="mb-3 mt-4">ユーザー</h5>
                <div class="list-group mb-4">
                    {% for u in users %}
                        <a href="{% url 'sns:user_posts' u.username %}"
                           class="list-group-item list-group-item-action">
                            @{{ u.username }}
                        </a>
                    {% empty %}
                        <p class="text-muted">該当するユーザーはありません。</p>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function getCookie(name) {
        const cookies = document.cookie ? document.cookie.split(';') : [];
        for (const cookie of cookies) {
            const trimmed = cookie.trim();
            if (trimmed.startsWith(name + '=')) {
                return decodeURIComponent(trimmed.substring(name.length + 1));
            }
        }
        return null;
    }

    document.querySelectorAll('.ajax-like-btn').forEach(button => {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            const url = this.getAttribute('data-url');
            const btn = this;
            const csrfToken = getCookie('csrftoken');

            fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest',
                },
            })
            .then(response => response.json())
            .then(data => {
                const heartSpan = btn.querySelector('.heart');
                const countSpan = btn.querySelector('.like-count');
                if (data.is_liked) {
                    btn.classList.remove('btn-outline-danger');
                    btn.classList.add('btn-danger');
                    if (heartSpan) heartSpan.innerText = '❤️';
                } else {
                    btn.classList.remove('btn-danger');
                    btn.classList.add('btn-outline-danger');
                    if (heartSpan) heartSpan.innerText = '🤍';
                }
                if (countSpan) countSpan.innerText = data.like_count;
            })
            .catch(error => console.error("Error:", error));
        });
    });
});
</script>
{% endblock %}
