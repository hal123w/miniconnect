{% extends "sns/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="mb-4">新規投稿</h3>

            <div class="card rounded-3 shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="{{ form.content.id_for_label }}">本文</label>
                            {{ form.content }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="{{ form.image.id_for_label }}">画像（任意）</label>
                            {{ form.image }}
                        </div>

                        <div class="form-check mb-4">
                            {{ form.mutual_only }}
                            <label class="form-check-label" for="{{ form.mutual_only.id_for_label }}">
                                {{ form.mutual_only.label }}
                            </label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">投稿する</button>
                        </div>
                    </form>
                    <p class="text-center mt-3 mb-0">
                        <a href="{% url 'sns:index' %}" class="text-decoration-none text-secondary">トップ一覧へ戻る</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('input[type="file"]').forEach(function(el) {
        el.classList.add('form-control');
    });
    document.querySelectorAll('input[type="checkbox"]').forEach(function(el) {
        el.classList.add('form-check-input');
    });
});
</script>
{% endblock %}
