{% extends "sns/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="mb-4 text-danger">アカウントの削除</h3>

            <div class="card rounded-3 shadow-sm border border-danger">
                <div class="card-body p-4">
                    <p class="text-danger mb-4">
                        一度削除すると、これまでの投稿やフォロワーなどのデータはすべて消去され、元に戻せません。
                    </p>

                    <form method="POST" class="d-flex flex-wrap gap-2 justify-content-center">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">本当に削除する</button>
                        <a href="{% url 'sns:profile_edit' %}" class="btn btn-outline-secondary">キャンセル</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
