{% extends "sns/base.html" %}
{% block content %}
<div class="container mt-5 text-center">
    <h2>アカウントの削除</h2>
    <p class="text-danger">一度削除すると、これまでの投稿やフォロワーなどのデータはすべて消去され、元に戻せません。</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">本当に削除する</button>
        <a href="{% url 'sns:profile_edit' %}" class="btn btn-secondary">キャンセル</a>
    </form>
</div>
{% endblock %}
