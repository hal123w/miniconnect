<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'sns:index' %}">MiniConnect</a>
            <div class="navbar-nav ms-auto flex-row align-items-center">
                {% if user.is_authenticated %}
                    <a class="nav-link text-white me-3" href="{% url 'sns:create' %}">新規投稿</a>
                    <a class="nav-link text-white me-3" href="{% url 'sns:notifications' %}">通知</a>
                    <a class="nav-link text-white me-3" href="{% url 'sns:profile_edit' %}">設定</a>
                    <form action="{% url 'sns:logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="{% url 'sns:login' %}">ログイン</a>
                    <a class="btn btn-light btn-sm ms-2" href="{% url 'sns:signup' %}">新規登録</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
