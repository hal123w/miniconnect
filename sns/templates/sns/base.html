<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-md navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'sns:index' %}">MiniConnect</a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="メニューを開く">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                {% if user.is_authenticated %}
                    <ul class="navbar-nav ms-auto align-items-md-center gap-md-1 py-2 py-md-0">
                        <li class="nav-item">
                            <a class="nav-link px-3" href="{% url 'sns:create' %}">新規投稿</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3" href="{% url 'sns:search' %}">検索</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3" href="{% url 'sns:ranking' %}">ランキング</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3" href="{% url 'sns:notifications' %}">通知</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3" href="{% url 'sns:profile_edit' %}">設定</a>
                        </li>
                        <li class="nav-item ms-md-2 mt-2 mt-md-0">
                            <form action="{% url 'sns:logout' %}" method="post" class="mb-0">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light btn-sm w-100 w-md-auto">ログアウト</button>
                            </form>
                        </li>
                    </ul>
                {% else %}
                    <ul class="navbar-nav ms-auto align-items-md-center gap-2 py-2 py-md-0">
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm w-100 w-md-auto" href="{% url 'sns:login' %}">ログイン</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-light btn-sm w-100 w-md-auto" href="{% url 'sns:signup' %}">新規登録</a>
                        </li>
                    </ul>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
